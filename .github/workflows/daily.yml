name: daily-concerts

on:
  schedule:
    # 예약 실행은 5~20분 늦게 시작될 때가 많아 20분 일찍 건다.
    - cron: "40 2 * * *"   # 11:40 KST  점심: 이번 주 게시
    - cron: "40 8 * * *"   # 17:40 KST  저녁: 다음 주·다다음 주 게시
    # 정시 게시가 중요하면 외부 크론(cron-job.org 등)에서 workflow_dispatch(slot=auto, dry_run=false)를 호출
  workflow_dispatch:
    inputs:
      slot:
        description: "게시 회차 (auto: 시작 시각 기준, 15시 전이면 점심)"
        type: choice
        options: [auto, noon, evening]
        default: auto
      dry_run:
        description: "인스타 업로드 생략 (테스트)"
        type: boolean
        default: true
      max_posts:
        description: "이번에 올릴 최대 게시물 수 (0: 전부)"
        type: string
        default: "0"
      force:
        description: "이미 게시한 게시물도 다시 게시"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-concerts
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      site_url: ${{ steps.url.outputs.site_url }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pages URL
        id: url
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER}.github.io/${REPO}"
          fi
          echo "site_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Slot
        id: slot
        run: |
          # 회차는 '실제로 시작한 시각'(KST)으로 정한다. GitHub 예약 실행은 몇 시간씩 늦어질 때가 있어서,
          # 시간대를 벗어나 늦게 시작한 예약 실행은 게시하지 않는다 (새벽 게시 방지).
          H=$((10#$(date +%H)))
          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ] || [ "$SLOT" = "auto" ]; then
            if [ $H -ge 10 ] && [ $H -lt 15 ]; then SLOT=noon
            elif [ $H -ge 16 ] && [ $H -lt 21 ]; then SLOT=evening
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ $H -lt 15 ]; then SLOT=noon; else SLOT=evening; fi
            else SLOT=skip; fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "slot: $SLOT (KST $(date +%H:%M), event ${{ github.event_name }})"

      - name: Collect
        if: steps.slot.outputs.slot != 'skip'
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_STORAGE_STATE_B64: ${{ secrets.X_STORAGE_STATE_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py collect

      - name: Build page + carousel
        if: steps.slot.outputs.slot != 'skip'
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python main.py build --slot ${{ steps.slot.outputs.slot }}

      - name: Save data
        if: steps.slot.outputs.slot != 'skip'
        continue-on-error: true
        run: |
          git config user.name "concert-bot"
          git config user.email "concert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          # GitHub 쪽 일시 오류로 push가 실패해도 배포·게시는 계속한다
          for i in 1 2 3; do git push && break || (sleep 15; git pull --rebase -q); done || true

      - uses: actions/upload-artifact@v4
        if: steps.slot.outputs.slot != 'skip'
        with:
          name: manifest
          path: site/cards/*/manifest.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.slot.outputs.slot != 'skip'
        with:
          path: site

  deploy:
    needs: collect-build
    if: needs.collect-build.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [collect-build, deploy]
    if: needs.collect-build.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 방금 커밋한 data/ 포함

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: site/cards

      - name: Publish to Instagram
        env:
          SITE_URL: ${{ needs.collect-build.outputs.site_url }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS="--slot ${{ needs.collect-build.outputs.slot }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.max_posts }}" ]; then ARGS="$ARGS --max-posts ${{ inputs.max_posts }}"; fi
          python main.py publish $ARGS

      - name: Save posted log
        if: always()
        run: |
          git config user.name "concert-bot"
          git config user.email "concert-bot@users.noreply.github.com"
          git add data/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted: $(date +%F)" && git pull --rebase && git push)
