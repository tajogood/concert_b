name: daily-concerts

on:
  schedule:
    # 예약 실행은 5~20분 늦게 시작될 때가 많아 20분 일찍 건다.
    - cron: "40 2 * * *"   # 11:40 KST  점심: 수집 + 이번 주 게시
    - cron: "40 8 * * *"   # 17:40 KST  저녁: 다음 주·다다음 주 게시
  workflow_dispatch:
    inputs:
      slot:
        description: "게시 회차 (auto: 15시 전이면 점심)"
        type: choice
        options: [auto, noon, evening]
        default: auto
      dry_run:
        description: "인스타 업로드 생략 (테스트)"
        type: boolean
        default: true
      force:
        description: "이미 게시한 게시물도 다시 게시"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-concerts
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      site_url: ${{ steps.url.outputs.site_url }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pages URL
        id: url
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER}.github.io/${REPO}"
          fi
          echo "site_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Slot
        id: slot
        run: |
          SLOT="${{ inputs.slot }}"
          if [ "${{ github.event.schedule }}" = "40 2 * * *" ]; then SLOT=noon; fi
          if [ "${{ github.event.schedule }}" = "40 8 * * *" ]; then SLOT=evening; fi
          if [ -z "$SLOT" ] || [ "$SLOT" = "auto" ]; then
            if [ "$(date +%H)" -lt 15 ]; then SLOT=noon; else SLOT=evening; fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "slot: $SLOT"

      - name: Collect
        if: steps.slot.outputs.slot == 'noon'
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_STORAGE_STATE_B64: ${{ secrets.X_STORAGE_STATE_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py collect

      - name: Build page + carousel
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
        run: python main.py build --slot ${{ steps.slot.outputs.slot }}

      - name: Save data
        run: |
          git config user.name "concert-bot"
          git config user.email "concert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: site/cards/*/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [collect-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 방금 커밋한 data/ 포함

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: site/cards

      - name: Publish to Instagram
        env:
          SITE_URL: ${{ needs.collect-build.outputs.site_url }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS="--slot ${{ needs.collect-build.outputs.slot }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python main.py publish $ARGS

      - name: Save posted log
        if: always()
        run: |
          git config user.name "concert-bot"
          git config user.email "concert-bot@users.noreply.github.com"
          git add data/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted: $(date +%F)" && git pull --rebase && git push)
