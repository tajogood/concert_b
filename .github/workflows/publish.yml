name: publish

# 수집과 완전히 별개: 저장소에 저장된 data/events.json 으로 그 회차 게시물을 직접 만들고 → 배포 → 인스타 게시.
# 그날 수집이 안 돌았어도 정해진 시각에 게시된다.
# GitHub 예약 실행은 늦거나 빠지는 일이 잦아 회차마다 세 번 예약한다. 먼저 성공한 실행이 올리고,
# 나머지는 data/posted.json 의 완료 표시를 보고 바로 끝난다.
on:
  schedule:
    - cron: "0 3 * * *"    # 12:00 KST 점심: 이번 주
    - cron: "20 3 * * *"   # 12:20 재시도
    - cron: "45 3 * * *"   # 12:45 재시도
    - cron: "0 9 * * *"    # 18:00 KST 저녁: 다음 주·다다음 주
    - cron: "20 9 * * *"   # 18:20 재시도
    - cron: "45 9 * * *"   # 18:45 재시도
  workflow_dispatch:
    inputs:
      slot:
        description: "게시 회차 (auto: 지금 시각 기준, 15시 전 noon)"
        type: choice
        options: [auto, noon, evening]
        default: auto
      dry_run:
        description: "인스타 업로드 생략 (테스트)"
        type: boolean
        default: true
      only:
        description: "올릴 게시물 종류"
        type: choice
        options: [all, concert, festival]
        default: all
      max_posts:
        description: "이번에 올릴 최대 게시물 수 (0: 전부)"
        type: string
        default: "0"
      force:
        description: "이미 게시한 게시물도 다시 게시"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: concert-bot
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      site_url: ${{ steps.slot.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Slot
        id: slot
        run: |
          # 회차는 실제 실행 시각이 아니라 '어느 예약으로 시작됐는지'로 정한다 (늦게 돌아도 회차가 바뀌지 않음)
          H=$((10#$(date +%H)))
          SCHED="${{ github.event.schedule }}"
          SLOT="${{ inputs.slot }}"
          if [ -n "$SCHED" ]; then
            UH=$(echo "$SCHED" | awk '{print $2}')
            if [ "$UH" = "3" ]; then SLOT=noon; else SLOT=evening; fi
            # 자정을 넘겨 다음 날 새벽에 시작되면 날짜가 바뀌어 엉뚱한 날 게시물이 되므로 건너뜀
            if [ $H -lt 8 ]; then SLOT=skip; fi
          elif [ -z "$SLOT" ] || [ "$SLOT" = "auto" ]; then
            if [ $H -lt 15 ]; then SLOT=noon; else SLOT=evening; fi
          fi
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER}.github.io/${REPO}"
          fi
          echo "site_url=$URL" >> "$GITHUB_OUTPUT"
          if [ "$SLOT" != "skip" ] && [ "${{ inputs.force }}" != "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            RUN="$(date +%F)-$SLOT"
            if python3 -c "import json,sys; d=json.load(open('data/posted.json')); sys.exit(0 if '_done' in d.get('$RUN',{}) else 1)" 2>/dev/null; then
              echo "이번 회차는 이미 게시 완료"; SLOT=skip
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "slot: $SLOT (KST $(date +%F\ %H:%M), event ${{ github.event_name }} ${SCHED})"

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.slot != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.slot.outputs.slot != 'skip'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build site + this slot's posts (저장된 데이터만 사용)
        if: steps.slot.outputs.slot != 'skip'
        env:
          SITE_URL: ${{ steps.slot.outputs.site_url }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python main.py build --slot ${{ steps.slot.outputs.slot }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.slot.outputs.slot != 'skip'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [build, deploy]
    if: needs.build.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish to Instagram
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS="--slot ${{ needs.build.outputs.slot }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.max_posts }}" ]; then ARGS="$ARGS --max-posts ${{ inputs.max_posts }}"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python main.py publish $ARGS

      - name: Save posted log
        if: always()
        run: |
          git config user.name "concert-bot"
          git config user.email "concert-bot@users.noreply.github.com"
          git add data/posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "posted: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 15; done
